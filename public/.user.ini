; PHP Upload Settings untuk Template Images (100MB)
; File ini digunakan untuk shared hosting yang mendukung .user.ini
; Jika tidak berfungsi, gunakan .htaccess atau edit php.ini langsung

upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

